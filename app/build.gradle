apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

// ⚠ THE DJI KEY LIVES IN app/dji-key.properties, WHICH IS GITIGNORED.
//
// Copy app/dji-key.properties.example to app/dji-key.properties and fill it in. Without it the
// manifest placeholder is empty and the SDK registration fails with a clear error, which is
// better than a build that silently produces an application no aircraft will talk to.
//
// The AIRCRAFT_API_KEY line in gradle.properties is a fallback and MUST STAY EMPTY. This
// repository is public: anything committed here is published irreversibly, so the key never
// goes in a tracked file.
//
// The key is bound to the applicationId in the DJI developer console: register the id below
// (or your own) under your developer account and use the key that entry gives you.
def djiApiKey = project.hasProperty('AIRCRAFT_API_KEY') ? project.AIRCRAFT_API_KEY : ''
def djiKeyFile = file('dji-key.properties')
if (djiKeyFile.exists()) {
    def p = new Properties()
    djiKeyFile.withInputStream { p.load(it) }
    if (p['AIRCRAFT_API_KEY']) {
        djiApiKey = p['AIRCRAFT_API_KEY']
    }
}

android {
    // The namespace is the DJI sample's package root, which the sources keep. The app
    // identity is the applicationId below, not the namespace.
    namespace "com.dji.sdk.sample"
    compileSdkVersion Integer.parseInt(project.ANDROID_COMPILE_SDK_VERSION)

    defaultConfig {
        // The DJI key is bound to this id. Change it to your own if you prefer, and register
        // the same id in the DJI developer console.
        applicationId "org.takpilot2.djiv5"
        minSdkVersion Integer.parseInt(project.ANDROID_MIN_SDK_VERSION)
        targetSdkVersion Integer.parseInt(project.ANDROID_TARGET_SDK_VERSION)
        // Bump versionCode on every build that goes on a device; tools/install.sh does it.
        versionCode 169
        versionName "2.5.0"
        buildConfigField "String", "BUILD_TIME",
                "\"${new Date().format('yyyy-MM-dd HH:mm', TimeZone.getTimeZone('UTC'))} UTC\""
        manifestPlaceholders["API_KEY"] = djiApiKey
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters 'arm64-v8a'
        }
    }

    // Release signing comes from app/keystore.properties (gitignored).
    // Without it the release APK builds unsigned.
    def keystoreProps = new Properties()
    def keystoreFile = file('keystore.properties')
    if (keystoreFile.exists()) {
        keystoreFile.withInputStream { keystoreProps.load(it) }
    }
    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            // Stated explicitly so there is a project keep-rules file to put a rule in when one
            // is needed (the DJI AAR ships its own consumer rules, so a build works without
            // one). proguard-rules.pro pins SourceFile/LineNumberTable so a fielded crash trace
            // maps back to a line, not just a method. Deliberately the NON-optimize default;
            // switching to proguard-android-optimize.txt is a separate, tested decision.
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    packagingOptions {
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        // The DJI native libs must not be stripped. List from the
        // official v5 sample.
        doNotStrip "*/*/libconstants.so"
        doNotStrip "*/*/libdji_innertools.so"
        doNotStrip "*/*/libdjibase.so"
        doNotStrip "*/*/libDJICSDKCommon.so"
        doNotStrip "*/*/libDJIFlySafeCore-CSDK.so"
        doNotStrip "*/*/libdjifs_jni-CSDK.so"
        doNotStrip "*/*/libDJIRegister.so"
        doNotStrip "*/*/libdjisdk_jni.so"
        doNotStrip "*/*/libDJIUpgradeCore.so"
        doNotStrip "*/*/libDJIUpgradeJNI.so"
        doNotStrip "*/*/libDJIWaypointV2Core-CSDK.so"
        doNotStrip "*/*/libdjiwpv2-CSDK.so"
        doNotStrip "*/*/libFlightRecordEngine.so"
        doNotStrip "*/*/libvideo-framing.so"
        doNotStrip "*/*/libwaes.so"
        doNotStrip "*/*/libagora-rtsa-sdk.so"
        doNotStrip "*/*/libc++.so"
        doNotStrip "*/*/libc++_shared.so"
        doNotStrip "*/*/libmrtc_28181.so"
        doNotStrip "*/*/libmrtc_agora.so"
        doNotStrip "*/*/libmrtc_core.so"
        doNotStrip "*/*/libmrtc_core_jni.so"
        doNotStrip "*/*/libmrtc_data.so"
        doNotStrip "*/*/libmrtc_log.so"
        doNotStrip "*/*/libmrtc_onvif.so"
        doNotStrip "*/*/libmrtc_rtmp.so"
        doNotStrip "*/*/libmrtc_rtsp.so"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
        freeCompilerArgs += ["-Xjvm-default=all"]
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        // Pure-logic tests only; android.util.Log calls return defaults instead of throwing.
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // DJI MSDK v5
    compileOnly "com.dji:dji-sdk-v5-aircraft-provided:5.18.0"
    implementation "com.dji:dji-sdk-v5-aircraft:5.18.0"
    runtimeOnly "com.dji:dji-sdk-v5-networkImp:5.18.0"

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // Map. MapLibre 9.x keeps the com.mapbox.* package names this code uses.
    implementation('org.maplibre.gl:android-sdk:9.6.0') {
        exclude group: 'androidx.lifecycle'
        exclude group: 'androidx.fragment'
        exclude group: 'com.google.android.gms'
    }

    // Terrain (DTED) and FAA-ceiling (UASFM) tile indexes.
    implementation 'androidx.room:room-runtime:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    testImplementation 'junit:junit:4.13.2'
}

/**
 * Keep the R8 mapping FILE beside the APK it belongs to.
 *
 * `mapping.txt` is only written to `app/build/outputs/mapping/release/`, which a
 * `./gradlew clean` deletes and which is gitignored. Once it is gone, every crash trace from
 * the fielded build is unreadable — obfuscated frames with nothing to map them back with.
 * Copying it out at build time makes the mapping as durable as the APK, and names it after the
 * version so mappings cannot be confused between releases (a trace needs the mapping of the
 * exact build that produced it).
 *
 * ⚠ The name carries versionCODE as well as versionName, and that is load-bearing. Keyed on
 * the name alone, a rebuild at the same version silently overwrites the mapping of a build
 * that is already on a controller. versionCode must be bumped for every build that goes on a
 * device, so including it makes a shipped mapping unoverwritable.
 *
 * The copy goes to `releases/` at the repository root (gitignored).
 */
afterEvaluate {
    def assembleRelease = tasks.findByName('assembleRelease')
    if (assembleRelease != null) {
        assembleRelease.doLast {
            def mapping = file("${layout.buildDirectory.get().asFile}/outputs/mapping/release/mapping.txt")
            if (!mapping.exists()) {
                logger.warn("no mapping.txt produced — release crash traces will not be readable")
                return
            }
            def outDir = file("${rootDir}/releases")
            outDir.mkdirs()
            def dest = new File(outDir, "TAKPilot2-DJIv5-v${android.defaultConfig.versionName}" +
                    "-vc${android.defaultConfig.versionCode}-mapping.txt")
            dest.bytes = mapping.bytes
            logger.lifecycle("R8 mapping preserved -> ${dest}")
        }
    }
}
